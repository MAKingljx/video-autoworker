name: Docker Diagnostic Build

on:
  workflow_run:
    workflows: ['Quality Gate']
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docker-diagnostic-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostic:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dockerfile produces synthetic dirty provenance for diagnostics only.
      # Keep registry credentials and image exporters out of this workflow.
      - name: Build diagnostic image without export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
