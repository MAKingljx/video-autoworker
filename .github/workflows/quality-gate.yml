name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 显式运行完整测试套件
        type: boolean
        required: false
        default: false
      base_sha:
        description: 定向检查的基准提交（留空则执行静态与构建检查）
        type: string
        required: false

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-autoworker
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      partitions: ${{ steps.plan.outputs.partitions }}
      integration: ${{ steps.plan.outputs.integration }}
      plugins: ${{ steps.plan.outputs.plugins }}
      browser: ${{ steps.plan.outputs.browser }}
      image: ${{ steps.plan.outputs.image }}
      impact: ${{ steps.plan.outputs.impact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: video-autoworker/.nvmrc
      - name: Select checks from the change scope
        id: plan
        env:
          CHANGE_BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          args=()
          if [[ -n "$CHANGE_BASE" ]]; then args+=(--base "$CHANGE_BASE"); fi
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force-full); fi
          node scripts/ci-impact-plan.mjs "${args[@]}" > "$RUNNER_TEMP/ci-impact.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync, lstatSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { resolve } from 'node:path'
          import { resolveGitSourceLayout, gitSourceEnvironment } from './scripts/lib/git-source-layout.mjs'
          import { scanReleaseFile } from './scripts/check-sensitive-content.mjs'
          import { assertCiTrackedSourceBoundary } from './scripts/ci-impact-plan.mjs'
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/ci-impact.json`))
          const { gitRoot } = resolveGitSourceLayout(process.cwd())
          const git = args => execFileSync('git', ['-C', gitRoot, ...args], { encoding: 'utf8', env: gitSourceEnvironment() })
          const paths = git(['ls-files', '-z']).split('\0').filter(Boolean)
          assertCiTrackedSourceBoundary(paths)
          if (plan.mode === 'docs') {
            git(['diff', '--check', plan.base, plan.head])
            const changed = git(['diff', '--name-only', '-z', '--diff-filter=ACMR', plan.base, plan.head]).split('\0').filter(Boolean)
            const findings = []
            for (const member of changed) {
              const file = resolve(gitRoot, member)
              const stat = lstatSync(file)
              if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('Unsafe documentation member')
              findings.push(...scanReleaseFile(member, readFileSync(file), { useTypescript: false }))
            }
            if (findings.length) throw new Error(`Sensitive content detected: ${JSON.stringify(findings)}`)
          } else {
            git(['show', '--format=', '--check', plan.head])
          }
          const values = {
            mode: plan.mode, base: plan.base || '',
            partitions: JSON.stringify(plan.rootPartitions.length ? plan.rootPartitions : ['regular']),
            integration: String(plan.runIntegration), plugins: String(plan.runPluginTests),
            browser: String(plan.runBrowserTests), impact: JSON.stringify(plan),
            image: String(plan.runImageTests),
          }
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([k,v]) => `${k}=${v}\n`).join(''))
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `检查范围：${plan.mode}\n\n原因：${plan.reasons.join(', ')}\n\n变更文件：${plan.changedCount}；根测试分组：${plan.rootPartitions.length}。\n\n浏览器测试：${plan.browserTestFiles.join(', ') || '本次无相关项'}\n\n浏览器选择依据：${plan.browserReasons.join(', ')}\n`)
          JS

  root-tests:
    needs: plan
    if: needs.plan.outputs.mode != 'docs' && needs.plan.outputs.mode != 'image-component'
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        partition: ${{ fromJSON(needs.plan.outputs.partitions) }}
    defaults:
      run:
        working-directory: video-autoworker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: video-autoworker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: video-autoworker/.nvmrc
          cache: pnpm
          cache-dependency-path: video-autoworker/pnpm-lock.yaml
      - name: Configure isolated test identity
        run: |
          git config --global user.email "ci@mission-control.dev"
          git config --global user.name "CI"
      - run: pnpm install --frozen-lockfile
      - name: Run the selected test partition
        env:
          CI_PARTITION: ${{ matrix.partition }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
          CI_IMPACT_PLAN: ${{ needs.plan.outputs.impact }}
        run: |
          args=(--partition "$CI_PARTITION")
          if [[ "$CI_MODE" == targeted && "$CI_PARTITION" == regular ]]; then
            node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/ci-impact.json", process.env.CI_IMPACT_PLAN)'
            args+=(--impact-plan "$RUNNER_TEMP/ci-impact.json")
          fi
          node scripts/run-root-vitest.mjs "${args[@]}"

  integration:
    needs: plan
    if: needs.plan.outputs.mode != 'docs' && needs.plan.outputs.mode != 'image-component'
    runs-on: macos-15
    defaults:
      run:
        working-directory: video-autoworker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: video-autoworker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: video-autoworker/.nvmrc
          cache: pnpm
          cache-dependency-path: video-autoworker/pnpm-lock.yaml
      - name: Resolve platform and ABI build cache identity
        id: build-cache
        if: needs.plan.outputs.integration == 'true'
        env:
          CI_IMPACT_PLAN: ${{ needs.plan.outputs.impact }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { createBuildCacheDescriptor } from './scripts/ci-impact-plan.mjs'
          const plan = JSON.parse(process.env.CI_IMPACT_PLAN)
          const current = createBuildCacheDescriptor({ productRoot: process.cwd() })
          for (const field of ['packageManager', 'lockSha256', 'buildConfigSha256']) {
            if (current[field] !== plan.buildCache?.[field]) throw new Error(`Build cache input changed: ${field}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `key=${current.key}\n`)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `构建缓存：os=${current.os} arch=${current.arch} nodeAbi=${current.nodeAbi} lock=${current.lockSha256.slice(0,12)} config=${current.buildConfigSha256.slice(0,12)}\n`)
          JS
      - uses: actions/cache@v4
        if: needs.plan.outputs.integration == 'true'
        with:
          path: video-autoworker/.next/cache
          key: vaw-next-${{ steps.build-cache.outputs.key }}
      - run: pnpm install --frozen-lockfile
      - name: Verify SQLite native ABI loading
        run: |
          node - <<'JS'
          const Database = require('better-sqlite3')
          const database = new Database(':memory:')
          try {
            const value = database.prepare('SELECT 1 AS ok').get()
            if (value?.ok !== 1) throw new Error('SQLite native probe returned an invalid result')
          } finally {
            database.close()
          }
          JS
      - name: Source privacy and static checks
        run: |
          pnpm scan:sensitive:source
          pnpm api:parity
          pnpm lint
          pnpm typecheck
      - name: Changed OpenClaw plugin checks
        if: needs.plan.outputs.plugins == 'true'
        env:
          CI_IMPACT_PLAN: ${{ needs.plan.outputs.impact }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          const plan = JSON.parse(process.env.CI_IMPACT_PLAN)
          const scripts = new Map([
            ['director-brain', 'test:openclaw-director-brain'],
            ['video-command', 'test:openclaw-video-command'],
            ['task-flow', 'test:openclaw-task-flow'],
          ])
          for (const suite of plan.pluginSuites || []) {
            if (suite === 'image-command') {
              if (plan.runImageTests !== true) throw new Error('Image plugin checks must be selected')
              continue // This suite needs Node24 and runs in image-component.
            }
            if (!scripts.has(suite)) throw new Error('Unknown plugin test suite')
            execFileSync('pnpm', [scripts.get(suite)], { stdio: 'inherit' })
          }
          if (plan.mode === 'full') execFileSync('pnpm', ['qa:contracts'], { stdio: 'inherit' })
          JS
      - name: Prepare E2E environment
        if: needs.plan.outputs.integration == 'true'
        run: cp .env.test .env
      - name: Build and audit standalone artifact
        if: needs.plan.outputs.integration == 'true'
        run: |
          pnpm build
          pnpm audit:standalone
      - name: Install Playwright browsers
        if: needs.plan.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps
      - name: E2E tests
        if: needs.plan.outputs.browser == 'true'
        env:
          CI_IMPACT_PLAN: ${{ needs.plan.outputs.impact }}
        run: node scripts/run-browser-tests.mjs
      - name: Package the verified runtime artifact
        if: needs.plan.outputs.integration == 'true'
        run: node scripts/package-runtime-artifact.mjs pack --artifact .next/standalone --output .artifacts
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.integration == 'true'
        with:
          name: runtime-${{ github.sha }}-${{ github.run_id }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            video-autoworker/.artifacts/runtime-*.tar.gz
            video-autoworker/.artifacts/runtime-*.json
          if-no-files-found: error
          retention-days: 7
          # Only the two audited package patterns above are eligible. The
          # directory is hidden so generated release files stay out of Git.
          include-hidden-files: true
          compression-level: 0

  image-component:
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: video-autoworker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify image source privacy and selected checks
        env:
          CI_IMPACT_PLAN: ${{ needs.plan.outputs.impact }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { lstatSync, readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { assertCiTrackedSourceBoundary, isImageComponentPath, isCiControlPath, selectImagePythonTests } from './scripts/ci-impact-plan.mjs'
          import { resolveGitSourceLayout, gitSourceEnvironment } from './scripts/lib/git-source-layout.mjs'
          import { scanReleaseFile } from './scripts/check-sensitive-content.mjs'
          const plan = JSON.parse(process.env.CI_IMPACT_PLAN)
          selectImagePythonTests(plan)
          const { gitRoot, productPrefix } = resolveGitSourceLayout(process.cwd())
          const git = args => execFileSync('git', ['-C', gitRoot, ...args], { encoding: 'utf8', env: gitSourceEnvironment() })
          const tracked = git(['ls-files', '-z']).split('\0').filter(Boolean)
          assertCiTrackedSourceBoundary(tracked)
          const changed = plan.base ? new Set(git(['diff', '--name-only', '-z', '--diff-filter=ACMR', plan.base, plan.head]).split('\0').filter(Boolean)) : new Set()
          const members = tracked.filter(member => {
            const logical = productPrefix && member.startsWith(productPrefix) ? member.slice(productPrefix.length) : member
            return isImageComponentPath(logical) || isCiControlPath(logical) || changed.has(member)
          })
          if (!members.length) throw new Error('Image privacy scope is empty')
          const findings = []
          for (const member of members) {
            const file = resolve(gitRoot, member), stat = lstatSync(file)
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('Unsafe image component member')
            findings.push(...scanReleaseFile(member, readFileSync(file), { useTypescript: false, allowTestPlaceholders: true }))
          }
          if (findings.length) throw new Error(`Sensitive content detected: ${JSON.stringify(findings)}`)
          git(['diff', '--check', ...(plan.base ? [plan.base, plan.head] : [plan.head])])
          JS
      - name: Extract the existing lightweight hashed Python requirements
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path('ops/image-generation/qwen-image-edit-2511/requirements.lock').read_text().splitlines()
          blocks={};current=None
          for line in lines:
              package=re.fullmatch(r'([A-Za-z0-9_.-]+)==([0-9]+\.[0-9]+\.[0-9]+)\s*\\?',line)
              if package:
                  current=package[1].lower() if package[1].lower() in {'numpy','pillow'} else None
                  if current:
                      if current in blocks:raise RuntimeError('duplicate lightweight package pin')
                      blocks[current]={'version':package[2],'hashes':[]}
              elif current and re.fullmatch(r'\s+--hash=sha256:[a-f0-9]{64}\s*\\?',line):
                  blocks[current]['hashes'].append(line.strip().rstrip('\\').strip())
              elif line and not line.lstrip().startswith('#'):
                  current=None
          if set(blocks)!={'numpy','pillow'} or any(not v['hashes'] for v in blocks.values()):raise RuntimeError('lightweight hashed pins missing')
          records=[]
          for name in ['numpy','pillow']:
              item=blocks[name];records.append(name+'=='+item['version']+' '+' '.join(item['hashes']))
          Path(os.environ['RUNNER_TEMP'],'image-ci-requirements.txt').write_text('\n'.join(records)+'\n')
          PY
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/image-ci-requirements.txt"
      - name: Run selected image Python and Node suites without model downloads
        env:
          CI_IMPACT_PLAN: ${{ needs.plan.outputs.impact }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { lstatSync, readdirSync } from 'node:fs'
          import { selectImagePythonTests } from './scripts/ci-impact-plan.mjs'
          const plan = JSON.parse(process.env.CI_IMPACT_PLAN)
          const pythonTests = selectImagePythonTests(plan)
          for (const member of pythonTests) if (!lstatSync(member).isFile()) throw new Error('Selected Python suite is missing')
          const python = `import sys,unittest
          from pathlib import Path
          suite=unittest.TestSuite()
          for member in sys.argv[1:]:
              selected=unittest.defaultTestLoader.discover('tests',pattern=Path(member).name)
              if selected.countTestCases()==0:raise RuntimeError('selected Python suite is empty: '+member)
              suite.addTests(selected)
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)`
          execFileSync('python', ['-c', python, ...pythonTests], { stdio: 'inherit' })
          const dir = 'openclaw-plugins/aiworker-image-command/test'
          const pluginTests = readdirSync(dir).filter(name => name.endsWith('.test.mjs')).map(name => `${dir}/${name}`)
          if (!pluginTests.length) throw new Error('Selected image plugin suite is empty')
          execFileSync(process.execPath, ['--test', 'scripts/test-ci-impact-image-component.test.mjs', ...pluginTests], { stdio: 'inherit' })
          JS

  quality-gate:
    name: quality-gate
    needs: [plan, root-tests, integration, image-component]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          TEST_RESULT: ${{ needs.root-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          IMAGE_REQUIRED: ${{ needs.plan.outputs.image }}
          IMAGE_RESULT: ${{ needs.image-component.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$MODE" == docs || "$MODE" == image-component ]]; then
            test "$TEST_RESULT" = skipped
            test "$INTEGRATION_RESULT" = skipped
          else
            [[ "$MODE" == targeted || "$MODE" == full ]]
            test "$TEST_RESULT" = success
            test "$INTEGRATION_RESULT" = success
          fi
          if [[ "$MODE" == image-component || "$MODE" == full ]]; then test "$IMAGE_REQUIRED" = true; fi
          if [[ "$IMAGE_REQUIRED" == true ]]; then
            test "$IMAGE_RESULT" = success
          else
            test "$IMAGE_REQUIRED" = false
            test "$IMAGE_RESULT" = skipped
          fi
